<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>量化回测 - GS2026</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}?v=7">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}?v=7">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pages.css') }}?v=7">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/analysis_center.css') }}?v=7">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        .qbt-container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .qbt-section { background: #fff; border-radius: 8px; padding: 16px 20px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
        .qbt-section-title { font-size: 14px; font-weight: 600; margin-bottom: 10px; color: #333; }
        .qbt-row { display: flex; gap: 12px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
        .qbt-label { font-size: 13px; color: #555; font-weight: 500; min-width: 60px; }
        .qbt-input { font-size: 13px; padding: 5px 10px; border: 1px solid #ddd; border-radius: 4px; }
        .qbt-input:focus { border-color: #667eea; outline: none; box-shadow: 0 0 0 2px rgba(102,126,234,0.1); }
        .qbt-btn { padding: 7px 18px; border: none; border-radius: 5px; font-size: 13px; cursor: pointer; font-weight: 500; transition: all 0.2s; }
        .qbt-btn-primary { background: #667eea; color: #fff; }
        .qbt-btn-primary:hover { background: #5a6fd6; }
        .qbt-btn-primary:disabled { background: #ccc; cursor: not-allowed; }
        .qbt-btn-secondary { background: #fff; border: 1px solid #ddd; color: #555; }
        .qbt-btn-secondary:hover { background: #f5f5f5; }
        .qbt-btn-danger { background: #fff; border: 1px solid #f66; color: #f66; }

        .qbt-cond-row { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; padding: 6px 8px; background: #fafafa; border-radius: 4px; border: 1px solid #f0f0f0; }
        .qbt-cond-row select, .qbt-cond-row input { font-size: 12px; padding: 4px 8px; border: 1px solid #ddd; border-radius: 4px; }
        .qbt-cond-row select { min-width: 130px; }
        .qbt-cond-row input[type="number"] { width: 100px; }
        .qbt-remove-btn { border: none; background: none; color: #f44336; cursor: pointer; font-size: 16px; padding: 2px 6px; border-radius: 3px; }
        .qbt-remove-btn:hover { background: #fee; }

        .qbt-stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
        .qbt-stat-card { background: #f8f9fa; border-radius: 8px; padding: 12px; text-align: center; }
        .qbt-stat-label { font-size: 11px; color: #888; margin-bottom: 4px; }
        .qbt-stat-value { font-size: 20px; font-weight: 700; }

        .qbt-table { width: 100%; border-collapse: collapse; font-size: 12px; }
        .qbt-table th { background: #f5f7fa; padding: 8px 10px; text-align: left; border-bottom: 2px solid #e9ecef; font-weight: 600; position: sticky; top: 0; }
        .qbt-table td { padding: 6px 10px; border-bottom: 1px solid #f0f0f0; }
        .qbt-table tr:hover { background: #f8f9ff; }
        .qbt-table-wrap { max-height: 400px; overflow-y: auto; border: 1px solid #eee; border-radius: 6px; }

        .qbt-loading { text-align: center; padding: 40px; color: #888; }
        .qbt-empty { text-align: center; padding: 30px; color: #aaa; font-size: 13px; }

        .history-excluded { opacity: 0.5; }
        .history-excluded .qbt-history-main { text-decoration: line-through; }
        .excluded-badge { color: #f59e0b; font-size: 12px; margin-left: 8px; }
        .qbt-history-actions { display: flex; gap: 4px; }
        .qbt-history-actions .btn-sm { padding: 2px 8px; border-radius: 3px; font-size: 11px; cursor: pointer; border: 1px solid #ddd; background: #fff; }
        .qbt-history-actions .btn-sm:hover { background: #f0f0f0; }
        .qbt-history-actions .btn-sm.btn-danger { color: #f44336; border-color: #f44336; }
        .qbt-history-actions .btn-sm.btn-danger:hover { background: #fef2f2; }
    </style>
</head>
<body>
    <div class="app">
        {% set page_title = '分析中心' %}
        {% set active_page = 'ztb' %}
        {% include 'nav.html' %}

        <main class="app-main">
            <!-- 分析中心子模块导航 -->
            <div class="analysis-sub-nav" style="background: #f8f9fa; border-bottom: 1px solid #e9ecef; padding: 10px 20px;">
                <div style="display: flex; gap: 10px; max-width: 1400px; margin: 0 auto;">
                    <button onclick="location.href='/analysis'" class="sub-nav-btn" style="padding: 8px 16px; border-radius: 6px; color: #666; font-size: 14px; border: none; cursor: pointer; background: transparent;">📈 涨停分析</button>
                    <button onclick="location.href='/news'" class="sub-nav-btn" style="padding: 8px 16px; border-radius: 6px; color: #666; font-size: 14px; border: none; cursor: pointer; background: transparent;">📰 新闻分析</button>
                    <button onclick="location.href='/notice-analysis'" class="sub-nav-btn" style="padding: 8px 16px; border-radius: 6px; color: #666; font-size: 14px; border: none; cursor: pointer; background: transparent;">📋 公告分析</button>
                    <button onclick="location.href='/domain-analysis'" class="sub-nav-btn" style="padding: 8px 16px; border-radius: 6px; color: #666; font-size: 14px; border: none; cursor: pointer; background: transparent;">🌐 领域分析</button>
                    <button onclick="location.href='/analysis/backtest'" class="sub-nav-btn" style="padding: 8px 16px; border-radius: 6px; color: #666; font-size: 14px; border: none; cursor: pointer; background: transparent;">📊 回溯分析</button>
                    <button class="sub-nav-btn active" style="padding: 8px 16px; border-radius: 6px; color: #fff; background: #007bff; font-size: 14px; border: none; cursor: pointer;">🧪 量化回测</button>
                </div>
            </div>

            <!-- 主内容 -->
            <div class="qbt-container">
                <!-- 参数配置 -->
                <div class="qbt-section">
                    <div class="qbt-section-title">⚙️ 回测参数</div>

                    <!-- 日期区间和时间范围 -->
                    <div class="qbt-row">
                        <span class="qbt-label">回测区间:</span>
                        <input type="date" id="qbt-date-start" class="qbt-input" style="width:130px;">
                        <span style="color:#999;">~</span>
                        <input type="date" id="qbt-date-end" class="qbt-input" style="width:130px;">
                        <span id="qbt-trade-days" style="color:#666;font-size:12px;margin-left:8px;"></span>
                    </div>
                    <div class="qbt-row">
                        <span class="qbt-label" style="margin-left:0;">日内时间:</span>
                        <input type="time" id="qbt-time-start" value="09:30" class="qbt-input" style="width:100px;">
                        <span style="color:#999;">~</span>
                        <input type="time" id="qbt-time-end" value="15:00" class="qbt-input" style="width:100px;">
                    </div>

                    <!-- 止盈止损参数 -->
                    <div class="qbt-row">
                        <span class="qbt-label">止盈:</span>
                        <input type="number" id="qbt-tp" value="0.5" step="0.1" min="0.01" class="qbt-input" style="width:70px;">
                        <span style="font-size:12px;color:#888;">%</span>
                        <span class="qbt-label" style="margin-left:16px;">止损:</span>
                        <input type="number" id="qbt-sl" value="0.3" step="0.1" min="0.01" class="qbt-input" style="width:70px;">
                        <span style="font-size:12px;color:#888;">%</span>
                        <span class="qbt-label" style="margin-left:16px;">窗口:</span>
                        <input type="number" id="qbt-window" value="5" step="1" min="1" max="60" class="qbt-input" style="width:60px;">
                        <span style="font-size:12px;color:#888;">分钟</span>
                        <span class="qbt-label" style="margin-left:16px;">去重:</span>
                        <select id="qbt-dedup" class="qbt-input">
                            <option value="first_per_minute">每分钟每债取首个</option>
                            <option value="none">不去重</option>
                        </select>
                    </div>
                    <div class="qbt-row" style="margin-top:8px;">
                        <span class="qbt-label">价格偏移:</span>
                        <input type="number" id="qbt-offset" value="0.1" step="0.01" min="0" class="qbt-input" style="width:70px;">
                        <span style="font-size:12px;color:#888;">元</span>
                        <span class="qbt-label" style="margin-left:16px;">偏移模式:</span>
                        <select id="qbt-offset-mode" class="qbt-input">
                            <option value="fixed">固定金额</option>
                            <option value="percent">百分比</option>
                        </select>
                        <span style="font-size:11px;color:#666;margin-left:8px;">(实际买入价 = 信号价 + 偏移)</span>
                    </div>
                    <div class="qbt-row" style="margin-top:8px;">
                        <span class="qbt-label">成交模式:</span>
                        <select id="qbt-order-mode" class="qbt-input" onchange="onOrderModeChange()">
                            <option value="market" selected>立即成交（原有逻辑）</option>
                            <option value="limit">限价挂单（超时撤单）</option>
                        </select>
                        <span id="qbt-fill-timeout-group" style="display:none;margin-left:16px;">
                            <span class="qbt-label">挂单超时:</span>
                            <input type="number" id="qbt-fill-timeout" value="30" min="5" max="120" step="5" class="qbt-input" style="width:70px;">
                            <span style="font-size:12px;color:#888;">秒</span>
                            <span style="font-size:11px;color:#666;margin-left:8px;">(超时未成交则撤单)</span>
                        </span>
                    </div>
                    <div class="qbt-row" style="margin-top:8px;">
                        <span class="qbt-label">回测模式:</span>
                        <select id="qbt-timeline-mode" class="qbt-input" onchange="onTimelineModeChange()">
                            <option value="false" selected>独立模式(多信号并行)</option>
                            <option value="true">时间线模式(信号串行)</option>
                        </select>
                        <span class="qbt-label" style="margin-left:16px;">收益计算:</span>
                        <select id="qbt-return-calc" class="qbt-input" title="总收益计算方式">
                            <option value="compound" selected>复利(默认)</option>
                            <option value="average">平均</option>
                            <option value="curve">资金曲线</option>
                        </select>
                        <span class="qbt-label" style="margin-left:16px;">初始资金:</span>
                        <input type="number" id="qbt-initial-capital" value="1000000" step="100000" min="100000" class="qbt-input" style="width:100px;" disabled>
                        <span style="font-size:12px;color:#888;">元</span>
                    </div>
                </div>

                <!-- 历史记录 -->
                <div id="qbt-history-panel" class="qbt-section" style="display:none;background:#f8f9fa;">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
                        <div class="qbt-section-title" style="margin-bottom:0;">📜 最近回测记录 (最多10条，点击加载)</div>
                        <button onclick="loadBacktestHistory()" class="qbt-btn qbt-btn-secondary" style="font-size:11px;padding:3px 10px;">🔄 刷新</button>
                    </div>
                    <div id="qbt-history-list" style="max-height:200px;overflow-y:auto;"></div>
                </div>

                <!-- 入场条件 -->
                <div class="qbt-section">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
                        <div class="qbt-section-title" style="margin-bottom:0;">🎯 入场条件</div>
                        <button onclick="addBaseCondition()" class="qbt-btn qbt-btn-secondary" style="font-size:12px;padding:4px 12px;">+ 添加条件</button>
                    </div>
                    <div id="qbt-conditions"></div>
                </div>

                <!-- 操作按钮 -->
                <div class="qbt-section" style="display:flex;gap:10px;align-items:center;">
                    <button onclick="runQuantBacktest()" id="qbt-run-btn" class="qbt-btn qbt-btn-primary">🚀 执行回测</button>
                    <button onclick="runQuantBacktest(true)" id="qbt-force-btn" class="qbt-btn qbt-btn-secondary" title="数据变更后使用，忽略缓存强制重新计算">🔄 忽略缓存</button>
                    <button onclick="saveQbtScheme()" class="qbt-btn qbt-btn-secondary">💾 保存方案</button>
                    <select id="qbt-scheme-select" onchange="loadQbtScheme()" class="qbt-input" style="min-width:160px;">
                        <option value="">📂 加载方案...</option>
                    </select>
                    <button onclick="deleteQbtScheme()" class="qbt-btn qbt-btn-danger" title="删除当前方案" style="padding:7px 10px;">🗑</button>
                </div>

                <!-- Loading -->
                <div id="qbt-loading" class="qbt-section qbt-loading" style="display:none;">
                    <div style="font-size:16px;">⏳ 回测执行中...</div>
                    <div style="font-size:13px;color:#aaa;margin-top:6px;">正在分析数据，请稍候</div>
                </div>

                <!-- 统计概览 -->
                <div id="qbt-summary" class="qbt-section" style="display:none;">
                    <div class="qbt-section-title">📈 统计概览</div>
                    <div id="qbt-summary-cards" class="qbt-stats-grid"></div>
                </div>

                <!-- 交易明细 -->
                <div id="qbt-trades-section" class="qbt-section" style="display:none;">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
                        <div class="qbt-section-title" style="margin-bottom:0;">📋 交易明细</div>
                        <button onclick="exportQbtCSV()" class="qbt-btn qbt-btn-secondary" style="font-size:12px;padding:4px 12px;">📥 导出CSV</button>
                    </div>
                    <div id="qbt-trades-table" class="qbt-table-wrap"></div>
                </div>

                <!-- 涨跌幅曲线 -->
                <div id="qbt-chart-section" class="qbt-section" style="display:none;">
                    <div class="qbt-section-title">📉 累计收益曲线</div>
                    <div id="qbt-pnl-chart" style="width:100%;height:500px;"></div>
                </div>
            </div>
        </main>
    </div>

    <script>
        let _qbtFields = [];
        let _qbtTrades = [];
        let _conditions = [];
        let _groups = [];  // 每个group: {name, mode: 'and'|'or', subgroups: [{conditions:[]}, ...]}

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            // 默认日期（区间）
            const today = new Date().toISOString().slice(0, 10);
            document.getElementById('qbt-date-start').value = today;
            document.getElementById('qbt-date-end').value = today;

            // 加载字段
            fetch('/api/monitor/backtest/bond/fields')
                .then(r => r.json())
                .then(data => {
                    if (data.success) {
                        _qbtFields = data.fields;
                        // 默认条件
                        _conditions = [
                            {field: 'min1_change_pct', op: '>', value: 0.2},
                            {field: 'min1_change_pct', op: '<', value: 0.8},
                            {field: 'min1_amount', op: '>', value: 10000000}
                        ];
                        _groups = [];  // {name, mode, subgroups: [{conditions:[]}]}
                        renderConditions();
                    }
                }).catch(e => console.error('加载字段失败:', e));

            renderQbtSchemeSelect();
            loadBacktestHistory();  // 加载历史记录
            
            // 绑定日期变化事件
            document.getElementById('qbt-date-start').addEventListener('change', updateTradeDays);
            document.getElementById('qbt-date-end').addEventListener('change', updateTradeDays);
        });

        // 条件管理 - 新实现：支持条件组
        function _escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

        function _buildFieldOptions(selected) {
            const groups = {};
            _qbtFields.forEach(f => { if (!groups[f.group]) groups[f.group] = []; groups[f.group].push(f); });
            let html = '';
            for (const [grp, fields] of Object.entries(groups)) {
                html += '<optgroup label="' + _escHtml(grp) + '">';
                fields.forEach(f => { html += '<option value="' + f.name + '"' + (f.name===selected?' selected':'') + '>' + _escHtml(f.label) + '</option>'; });
                html += '</optgroup>';
            }
            return html;
        }

        function _buildOpOptions(selected, fieldName) {
            // 根据字段类型返回不同的操作符
            const field = _qbtFields.find(f => f.name === fieldName);
            const isStringField = field && field.type === 'str';
            
            if (isStringField) {
                // 字符串操作符
                const ops = ['=', '!=', 'contains', 'not_contains', 'startswith', 'endswith'];
                const opLabels = {
                    '=': '=',
                    '!=': '!=',
                    'contains': '包含',
                    'not_contains': '不包含',
                    'startswith': '开头是',
                    'endswith': '结尾是'
                };
                return ops.map(o => '<option value="' + o + '"' + (o===selected?' selected':'') + '>' + _escHtml(opLabels[o] || o) + '</option>').join('');
            } else {
                // 数值操作符
                const ops = ['>', '>=', '<', '<=', '=', '!=', 'between'];
                return ops.map(o => '<option value="' + o + '"' + (o===selected?' selected':'') + '>' + _escHtml(o) + '</option>').join('');
            }
        }

        function _renderConditionRow(c, path, idx) {
            // path: '_conditions' or '_groups[gi].subgroups[sgi].conditions'
            const isFieldCompare = c.is_field_compare || false;
            const compareField = c.compare_field || '';
            
            // 判断当前字段类型
            const fieldDef = _qbtFields.find(f => f.name === c.field);
            const isStringField = fieldDef && fieldDef.type === 'str';
            
            let html = '<div class="qbt-cond-row" style="display:flex;align-items:center;gap:6px;margin-bottom:4px;">';
            html += '<select onchange="' + path + '[' + idx + '].field=this.value;renderConditions()" style="flex:2;padding:4px;border:1px solid #ddd;border-radius:4px;font-size:12px;">' + _buildFieldOptions(c.field) + '</select>';
            html += '<select onchange="' + path + '[' + idx + '].op=this.value;renderConditions()" style="width:70px;padding:4px;border:1px solid #ddd;border-radius:4px;font-size:12px;">' + _buildOpOptions(c.op, c.field) + '</select>';
            
            // 字符串字段不支持字段间比较
            if (!isStringField) {
                // 字段间比较复选框（仅数值字段）
                html += '<label style="font-size:11px;color:#666;white-space:nowrap;">';
                html += '<input type="checkbox" ' + (isFieldCompare ? 'checked' : '') + ' onchange="' + path + '[' + idx + '].is_field_compare=this.checked;if(this.checked&&!' + path + '[' + idx + '].compare_field){' + path + '[' + idx + '].compare_field=_qbtFields[0]?.name||\'\'};renderConditions()" style="vertical-align:middle;margin-right:2px;">与字段比较';
                html += '</label>';
            }
            
            if (isFieldCompare && !isStringField) {
                // 字段间比较模式：显示字段选择器
                html += '<select onchange="' + path + '[' + idx + '].compare_field=this.value" style="flex:1;padding:4px;border:1px solid #ddd;border-radius:4px;font-size:12px;">' + _buildFieldOptions(compareField) + '</select>';
            } else if (isStringField) {
                // 字符串模式：显示文本输入框
                const val = c.value === undefined || c.value === null ? '' : c.value;
                html += '<input type="text" value="' + _escHtml(val) + '" onchange="' + path + '[' + idx + '].value=this.value" style="flex:1;padding:4px;border:1px solid #ddd;border-radius:4px;font-size:12px;" placeholder="值">';
            } else {
                // 数值模式：显示数值输入框
                html += '<input type="number" step="any" value="' + (c.value === undefined || c.value === null ? '' : c.value) + '" onchange="' + path + '[' + idx + '].value=parseFloat(this.value)" style="flex:1;padding:4px;border:1px solid #ddd;border-radius:4px;font-size:12px;" placeholder="值">';
                if (c.op === 'between') {
                    html += '<input type="number" step="any" value="' + (c.value2 === undefined || c.value2 === null ? '' : c.value2) + '" onchange="' + path + '[' + idx + '].value2=parseFloat(this.value)" style="flex:1;padding:4px;border:1px solid #ddd;border-radius:4px;font-size:12px;" placeholder="值2">';
                }
            }
            
            html += '<button onclick="' + path + '.splice(' + idx + ',1);renderConditions()" style="border:none;background:none;color:#e53e3e;cursor:pointer;font-size:14px;">✕</button>';
            html += '</div>';
            return html;
        }

        function _renderSubgroup(sg, gi, sgi) {
            let html = '<div style="border:1px dashed #ccc;border-radius:4px;padding:6px;margin-bottom:6px;background:#fff;">';
            const path = '_groups[' + gi + '].subgroups[' + sgi + '].conditions';
            sg.conditions.forEach((c, ci) => {
                html += _renderConditionRow(c, path, ci);
            });
            html += '<button onclick="_groups[' + gi + '].subgroups[' + sgi + '].conditions.push({field:_qbtFields[0].name,op:\'>\',value:\'\'});renderConditions()" style="font-size:11px;padding:2px 6px;border:1px dashed #aaa;border-radius:3px;background:none;cursor:pointer;color:#666;">+ 子条件</button>';
            html += '</div>';
            return html;
        }

        function renderConditions() {
            const container = document.getElementById('qbt-conditions');
            if (!container) return;
            let html = '';

            // 基础条件区
            html += '<div style="margin-bottom:8px;font-size:12px;font-weight:600;color:#555;">📋 基础条件（AND）</div>';
            html += '<div id="base-conditions">';
            _conditions.forEach((c, i) => {
                html += _renderConditionRow(c, '_conditions', i);
            });
            html += '<button onclick="_conditions.push({field:_qbtFields[0].name,op:\'>\',value:\'\'});renderConditions()" style="font-size:12px;padding:2px 8px;border:1px dashed #aaa;border-radius:4px;background:none;cursor:pointer;color:#666;">+ 基础条件</button>';
            html += '</div>';

            // 条件组区（AND关系）
            html += '<div style="margin-top:16px;margin-bottom:8px;font-size:12px;font-weight:600;color:#555;">🔀 条件组（AND关系，每组都必须满足）</div>';
            _groups.forEach((g, gi) => {
                if (gi > 0) {
                    html += '<div style="text-align:center;color:#4caf50;font-size:11px;font-weight:600;margin:8px 0;">── 且 ──</div>';
                }
                html += '<div style="border:2px solid #e5e7eb;border-radius:6px;padding:10px;margin-bottom:8px;background:#f9fafb;">';

        // 格式化时间值，确保返回 HH:MM:SS
        function formatTimeValue(timeVal) {
            // 处理 HH:MM 或 HH:MM:SS 格式
            if (!timeVal) return '09:30:00';
            
            // 清理输入，移除多余空格
            timeVal = timeVal.trim();
            
            const parts = timeVal.split(':');
            
            // 处理 HH:MM (2部分)
            if (parts.length === 2) {
                return timeVal + ':00';
            } 
            // 处理 HH:MM:SS (3部分)
            else if (parts.length === 3) {
                return timeVal;
            }
            // 处理只有小时 (1部分)
            else if (parts.length === 1) {
                return timeVal + ':00:00';
            }
            // 其他异常情况，返回默认值
            console.warn('Invalid time format:', timeVal);
            return '09:30:00';
        }

        // 删除历史记录
        async function deleteHistory(hash) {
            if (!confirm('确定删除这条回测记录?')) return;
            try {
                const resp = await fetch(`/api/monitor/backtest/history/${hash}`, {method: 'DELETE'});
                if (resp.ok) {
                    loadBacktestHistory();
                } else {
                    const data = await resp.json();
                    alert('删除失败: ' + (data.error || '未知错误'));
                }
            } catch (e) {
                alert('删除失败: ' + e.message);
            }
        }

        // 标记备注
        async function markHistory(hash, currentNote) {
            const note = prompt('输入备注(如:参数不切实际，留空则取消排除)', currentNote || '');
            if (note === null) return;  // 用户点了取消
            const isExcluded = note.length > 0;
            try {
                const resp = await fetch(`/api/monitor/backtest/history/${hash}`, {
                    method: 'PATCH',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({note: note, is_excluded: isExcluded})
                });
                if (resp.ok) {
                    loadBacktestHistory();
                } else {
                    const data = await resp.json();
                    alert('更新失败: ' + (data.error || '未知错误'));
                }
            } catch (e) {
                alert('更新失败: ' + e.message);
            }
        }

        // 从历史记录加载
        async function loadFromHistory(hash) {
            try {
                console.log('[History] Loading from hash:', hash);
                const response = await fetch(`/api/monitor/backtest/history/${hash}`);
                const result = await response.json();
                console.log('[History] Loaded data:', result);
                
                if (result.success) {
                    // 恢复参数
                    // result.result 包含 {meta: {...}, result: {summary, trades}}
                    const cachedData = result.result;
                    const params = cachedData?.meta?.params;
                    console.log('[History] cachedData:', cachedData);
                    console.log('[History] Extracted params:', params);
                    if (params) {
                        // 日期区间
                        const dateStart = params.date_start || params.date;
                        const dateEnd = params.date_end || params.date;
                        document.getElementById('qbt-date-start').value = dateStart?.replace(/(\d{4})(\d{2})(\d{2})/, '$1-$2-$3');
                        document.getElementById('qbt-date-end').value = dateEnd?.replace(/(\d{4})(\d{2})(\d{2})/, '$1-$2-$3');
                        
                        // 时间范围
                        if (params.time_start) {
                            document.getElementById('qbt-time-start').value = params.time_start.substring(0, 5);
                        }
                        if (params.time_end) {
                            document.getElementById('qbt-time-end').value = params.time_end.substring(0, 5);
                        }
                        
                        // 止盈止损
                        document.getElementById('qbt-tp').value = params.take_profit_pct;
                        document.getElementById('qbt-sl').value = params.stop_loss_pct;
                        document.getElementById('qbt-window').value = params.window_minutes;
                        
                        // 价格偏移
                        document.getElementById('qbt-offset').value = params.price_offset;
                        document.getElementById('qbt-offset-mode').value = params.offset_mode;
                        
                        // 回测模式
                        const timelineMode = typeof params.timeline_mode === 'string' 
                            ? params.timeline_mode === 'true' 
                            : !!params.timeline_mode;
                        document.getElementById('qbt-timeline-mode').value = timelineMode ? 'true' : 'false';
                        
                        // 收益计算方式
                        document.getElementById('qbt-return-calc').value = params.return_calc_method || 'compound';
                        
                        // 成交模式
                        const orderMode = params.order_mode || 'market';
                        document.getElementById('qbt-order-mode').value = orderMode;
                        document.getElementById('qbt-fill-timeout').value = params.fill_timeout_seconds || 30;
                        onOrderModeChange();
                        
                        // 初始资金
                        document.getElementById('qbt-initial-capital').value = params.initial_capital;
                        
                        // 去重模式
                        if (params.dedup) {
                            document.getElementById('qbt-dedup').value = params.dedup;
                        }
                        
                        // 恢复条件
                        if (params.conditions && Array.isArray(params.conditions)) {
                            _conditions = params.conditions;
                        } else {
                            _conditions = [];
                        }
                        if (params.groups && Array.isArray(params.groups)) {
                            _groups = params.groups;
                        } else {
                            _groups = [];
                        }
                        // 向后兼容：如果没有groups但有conditions，保持原样
                        if (_conditions.length === 0 && _groups.length === 0) {
                            // 默认条件
                            _conditions = [
                                {field: 'min1_change_pct', op: '>', value: 0.2},
                                {field: 'min1_change_pct', op: '<', value: 0.8},
                                {field: 'min1_amount', op: '>', value: 10000000}
                            ];
                        }
                        renderConditions();
                        
                        updateTradeDays();
                        
                        // 显示参数恢复提示
                        console.log('[History] 参数已恢复:', params);
                    }
                    
                    // 显示结果 (cachedData.result 包含 summary 和 trades)
                    const resultData = cachedData?.result;
                    if (resultData?.summary && resultData?.trades) {
                        renderQbtResults(resultData.summary, resultData.trades);
                    }
                    
                    // 标记为来自缓存
                    const summary = document.getElementById('qbt-summary');
                    summary.insertAdjacentHTML('afterbegin', 
                        '<div style="background:#e3f2fd;padding:8px 12px;border-radius:4px;margin-bottom:10px;color:#1976d2;">' +
                        '✓ 已加载缓存结果 (hash: ' + hash.substring(0, 8) + '...)</div>'
                    );
                }
            } catch (e) {
                console.error('加载历史记录失败:', e);
                alert('加载失败: ' + e.message);
            }
        }

        // 执行回测
        function runQuantBacktest(forceRefresh) {
            const dateStart = document.getElementById('qbt-date-start').value?.replace(/-/g, '');
            const dateEnd = document.getElementById('qbt-date-end').value?.replace(/-/g, '');
            
            if (!dateStart || !dateEnd) {
                alert('请选择回测区间');
                return;
            }
            
            if (dateStart > dateEnd) {
                alert('开始日期不能晚于结束日期');
                return;
            }
            
            const condData = getQbtConditions();
            if (condData.conditions.length === 0 && condData.groups.length === 0) { 
                alert('请至少添加一个条件或条件组'); 
                return; 
            }

            // 获取原始时间值并调试
            const rawTimeStart = document.getElementById('qbt-time-start').value;
            const rawTimeEnd = document.getElementById('qbt-time-end').value;
            console.log('Raw time values:', { time_start: rawTimeStart, time_end: rawTimeEnd });
            
            const formattedTimeStart = formatTimeValue(rawTimeStart || '09:30');
            const formattedTimeEnd = formatTimeValue(rawTimeEnd || '15:00');
            console.log('Formatted time values:', { time_start: formattedTimeStart, time_end: formattedTimeEnd });

            const payload = {
                date_start: dateStart,
                date_end: dateEnd,
                conditions: condData.conditions,
                groups: condData.groups,
                take_profit_pct: parseFloat(document.getElementById('qbt-tp').value) || 0.5,
                stop_loss_pct: parseFloat(document.getElementById('qbt-sl').value) || 0.3,
                window_minutes: parseInt(document.getElementById('qbt-window').value) || 5,
                price_offset: parseFloat(document.getElementById('qbt-offset').value) || 0.0,
                offset_mode: document.getElementById('qbt-offset-mode').value || 'fixed',
                timeline_mode: document.getElementById('qbt-timeline-mode').value === 'true',
                return_calc_method: document.getElementById('qbt-return-calc').value || 'compound',
                initial_capital: parseFloat(document.getElementById('qbt-initial-capital').value) || 1000000,
                dedup: document.getElementById('qbt-dedup').value,
                time_start: formattedTimeStart,
                time_end: formattedTimeEnd,
                skip_cache: !!forceRefresh,
                order_mode: document.getElementById('qbt-order-mode').value || 'market',
                fill_timeout_seconds: document.getElementById('qbt-order-mode').value === 'limit' ? (parseInt(document.getElementById('qbt-fill-timeout').value) || 30) : 0,
            };
            
            console.log('Final payload:', payload);

            document.getElementById('qbt-loading').style.display = 'block';
            document.getElementById('qbt-summary').style.display = 'none';
            document.getElementById('qbt-trades-section').style.display = 'none';
            document.getElementById('qbt-run-btn').disabled = true;
            document.getElementById('qbt-force-btn').disabled = true;

            const _btStartTime = Date.now();

            fetch('/api/monitor/backtest/bond', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(async r => {
                console.log('Response status:', r.status);
                const data = await r.json();
                console.log('Response data:', data);
                document.getElementById('qbt-loading').style.display = 'none';
                document.getElementById('qbt-run-btn').disabled = false;
                document.getElementById('qbt-force-btn').disabled = false;
                if (!data.success) { 
                    console.error('Backend error:', data);
                    alert('回测失败: ' + (data.error || '未知错误')); 
                    return; 
                }
                const totalMs = Date.now() - _btStartTime;
                renderQbtResults(data.summary, data.trades, {
                    elapsed_seconds: data.elapsed_seconds,
                    total_ms: totalMs,
                    cached: data.cached
                });
                
                // 刷新历史记录
                setTimeout(() => loadBacktestHistory(), 500);
            })
            .catch(e => {
                document.getElementById('qbt-loading').style.display = 'none';
                document.getElementById('qbt-run-btn').disabled = false;
                document.getElementById('qbt-force-btn').disabled = false;
                console.error('Request error:', e);
                alert('请求失败: ' + e.message);
            });
        }

                    <div class="qbt-stat-label">交易日数</div>
                    <div class="qbt-stat-value" style="color:#1976d2;">${s.trade_days}天</div>
                </div>
                <div class="qbt-stat-card" style="background:#f3e5f5;">
                    <div class="qbt-stat-label">日均信号</div>
                    <div class="qbt-stat-value" style="color:#9c27b0;">${s.avg_daily_signals}</div>
                </div>
                <div class="qbt-stat-card" style="background:#fff3e0;">
                    <div class="qbt-stat-label">日均收益</div>
                    <div class="qbt-stat-value" style="color:#f57c00;">${s.avg_daily_return}%</div>
                </div>
                <div class="qbt-stat-card" style="background:#fbe9e7;">
                    <div class="qbt-stat-label">收益波动</div>
                    <div class="qbt-stat-value" style="color:#f44336;">${s.return_volatility}%</div>
                </div>
                <div class="qbt-stat-card" style="background:#fce4ec;">
                    <div class="qbt-stat-label">最大连亏</div>
                    <div class="qbt-stat-value" style="color:#c2185b;">${s.max_consecutive_loss_days}天</div>
                </div>
                ` : ''}
                <div class="qbt-stat-card">
                    <div class="qbt-stat-label">平均耗时</div>
                    <div class="qbt-stat-value" style="color:#333;">${s.avg_duration_sec || 0}s</div>
                </div>
            `;
            // 【新增】执行时长卡片
            if (timing) {
                let timingHtml = '';
                if (!timing.cached && timing.elapsed_seconds > 0) {
                    timingHtml = `
                        <div class="qbt-stat-card" style="background:#eceff1;">
                            <div class="qbt-stat-label">⏱️ 执行时长</div>
                            <div class="qbt-stat-value" style="color:#607d8b;">${timing.elapsed_seconds}s</div>
                            <div style="font-size:11px;color:#999;margin-top:2px;">总耗时 ${(timing.total_ms / 1000).toFixed(1)}s</div>
                        </div>
                    `;
                } else if (timing.cached) {
                    timingHtml = `
                        <div class="qbt-stat-card" style="background:#e8f5e9;">
                            <div class="qbt-stat-label">⚡ 缓存命中</div>
                            <div class="qbt-stat-value" style="color:#4caf50;">${(timing.total_ms / 1000).toFixed(2)}s</div>
                        </div>
                    `;
                }
                if (timingHtml) {
                    document.getElementById('qbt-summary-cards').innerHTML += timingHtml;
                }
            }
            document.getElementById('qbt-summary').style.display = 'block';

            // 明细表
            if (trades.length === 0) {
                document.getElementById('qbt-trades-table').innerHTML = '<div class="qbt-empty">无命中信号，请调整条件</div>';
            } else {
                let html = '<table class="qbt-table"><thead><tr>';
                html += '<th>日期</th><th>代码</th><th>名称</th><th>信号时间</th><th>入场价</th><th>出场价</th><th>出场时间</th><th>结果</th><th>盈亏%</th><th>耗时</th>';
                html += '</tr></thead><tbody>';
                trades.forEach(t => {
                    const icon = t.exit_type === 'tp' ? '✅' : t.exit_type === 'sl' ? '❌' : '⏱';
                    const label = t.exit_type === 'tp' ? '止盈' : t.exit_type === 'sl' ? '止损' : '超时';
                    const color = t.profit_pct >= 0 ? '#4caf50' : '#f44336';
                    // 格式化日期显示 (20260701 -> 07-01)
                    let dateDisplay = t.date || '-';
                    if (dateDisplay.length === 8) {
                        dateDisplay = dateDisplay.substring(4, 6) + '-' + dateDisplay.substring(6);
                    }
                    html += `<tr>
                        <td>${dateDisplay}</td>
                        <td>${t.bond_code}</td>
                        <td>${t.bond_name || '-'}</td>
                        <td>${t.signal_time}</td>
                        <td style="text-align:right;">${t.entry_price}</td>
                        <td style="text-align:right;">${t.exit_price}</td>
                        <td>${t.exit_time}</td>
                        <td>${icon} ${label}</td>
                        <td style="text-align:right;color:${color};font-weight:600;">${t.profit_pct >= 0 ? '+' : ''}${t.profit_pct}%</td>
                        <td style="text-align:right;">${t.duration_sec}s</td>
                    </tr>`;
                });
                html += '</tbody></table></div>';
                document.getElementById('qbt-trades-table').innerHTML = html;
            }
            document.getElementById('qbt-trades-section').style.display = 'block';

            // 【新增】渲染涨跌幅曲线
            renderPnlChart(trades);
        }

        // 【新增】累计收益曲线图
        let _pnlChart = null;
        function renderPnlChart(trades) {
            const container = document.getElementById('qbt-pnl-chart');
            if (!trades || trades.length === 0) {
                document.getElementById('qbt-chart-section').style.display = 'none';
                return;
            }

            // 按日期+出场时间排序
            const sorted = [...trades].sort((a, b) => {
                const ta = (a.date || '') + (a.exit_time || '');
                const tb = (b.date || '') + (b.exit_time || '');
                return ta.localeCompare(tb);
            });

            // 构建所有点的数据，日期变化时显示日期标签
            let cumPct = 0;
            let prevDate = '';
            const xLabels = [];
            const yData = [];
            const colors = [];
            const tradeInfo = [];

            sorted.forEach((t, idx) => {
                cumPct += (t.profit_pct || 0);
                const curDate = t.date || '';
                const dateLabel = curDate.length === 8 ? curDate.substring(4,6) + '-' + curDate.substring(6) : curDate;

                // X轴标签：仅在日期变化时显示日期，其余为空
                if (curDate !== prevDate) {
                    xLabels.push(dateLabel);
                    prevDate = curDate;
                } else {
                    xLabels.push('');
                }

                yData.push(+cumPct.toFixed(3));
                colors.push(t.profit_pct >= 0 ? '#4caf50' : '#f44336');
                tradeInfo.push({
                    label: dateLabel + ' ' + (t.exit_time || ''),
                    trade: t
                });
            });

            // 销毁旧图表
            if (_pnlChart) { _pnlChart.dispose(); }
            _pnlChart = echarts.init(container);

            _pnlChart.setOption({
                tooltip: {
                    trigger: 'axis',
                    formatter: function(params) {
                        const p = params[0];
                        const idx = p.dataIndex;
                        const info = tradeInfo[idx];
                        const t = info.trade;
                        return info.label + ' (#' + (idx+1) + ')<br/>' +
                            '累计收益: <b>' + p.value + '%</b><br/>' +
                            '本笔: ' + (t.profit_pct >= 0 ? '+' : '') + t.profit_pct + '% ' +
                            '(' + (t.bond_name || t.bond_code) + ')';
                    }
                },
                grid: { left: 55, right: 15, top: 25, bottom: 40 },
                xAxis: {
                    type: 'category',
                    data: xLabels,
                    boundaryGap: false,
                    axisLabel: { fontSize: 11 },
                    axisTick: { alignWithLabel: true }
                },
                yAxis: {
                    type: 'value',
                    name: '累计收益%',
                    axisLabel: { formatter: '{value}%' }
                },
                series: [{
                    type: 'line',
                    data: yData,
                    smooth: true,
                    showSymbol: sorted.length <= 100,
                    lineStyle: { width: 2, color: '#1976d2' },
                    areaStyle: {
                        color: {
                            type: 'linear', x: 0, y: 0, x2: 0, y2: 1,
                            colorStops: [
                                { offset: 0, color: 'rgba(25,118,210,0.25)' },
                                { offset: 1, color: 'rgba(25,118,210,0.02)' }
                            ]
                        }
                    },
                    itemStyle: {
                        color: function(params) {
                            return colors[params.dataIndex];
                        }
                    },
                    symbolSize: sorted.length <= 100 ? 6 : 4,
                    markLine: {
                        silent: true,
                        data: [{ yAxis: 0, lineStyle: { color: '#999', type: 'dashed' } }]
                    }
                }]
            });

            window.addEventListener('resize', function() {
                if (_pnlChart) _pnlChart.resize();
            });
            document.getElementById('qbt-chart-section').style.display = 'block';
            // 容器可见后再resize，确保ECharts获取正确宽高
            setTimeout(() => { if (_pnlChart) _pnlChart.resize(); }, 50);
        }

        // 时间线模式切换处理
        function onTimelineModeChange() {
            const timelineMode = document.getElementById('qbt-timeline-mode').value === 'true';
            const initialCapitalInput = document.getElementById('qbt-initial-capital');
            const returnCalcSelect = document.getElementById('qbt-return-calc');
            
            if (timelineMode) {
                // 时间线模式：启用初始资金，禁用收益计算（时间线模式有自己的计算方式）
                initialCapitalInput.disabled = false;
                returnCalcSelect.value = 'compound';
                returnCalcSelect.disabled = true;
            } else {
                // 独立模式：禁用初始资金，启用收益计算
                initialCapitalInput.disabled = true;
                returnCalcSelect.disabled = false;
            }
        }

        function onOrderModeChange() {
            const mode = document.getElementById('qbt-order-mode').value;
            const group = document.getElementById('qbt-fill-timeout-group');
            group.style.display = mode === 'limit' ? 'inline' : 'none';
            // 切换模式时刷新历史记录显示
            loadBacktestHistory();
        }

        // 只使用API获取方案（注意：monitor_bp的URL前缀是/api/monitor）
        async function loadSchemesFromAPI() {
            const response = await fetch('/api/monitor/quant-schemes?scene=backtest', {
                method: 'GET',
                headers: { 'Accept': 'application/json' }
            });
            
            if (!response.ok) {
                throw new Error(`API错误: ${response.status}`);
            }
            
            const result = await response.json();
            if (!result.success) {
                throw new Error(result.error || '获取方案失败');
            }
            
            // 转换API格式到页面格式
            return result.schemes.map(s => ({
                name: s.scheme_name,
                conditions: s.conditions,
                tp_pct: s.take_profit_pct,
                sl_pct: s.stop_loss_pct,
                window_minutes: s.max_hold_time,
                price_offset: s.price_offset,
                offset_mode: s.offset_mode,
                timeline_mode: s.timeline_mode,
                initial_capital: s.initial_capital,
                time_start: s.time_start || '09:30',
                time_end: s.time_end || '15:00',
                dedup: 'first_per_minute',
                is_active: s.is_active
            }));
        }
        
        async function renderQbtSchemeSelect() {
            const sel = document.getElementById('qbt-scheme-select');
            try {
                const schemes = await loadSchemesFromAPI();
                sel.innerHTML = '<option value="">📂 加载方案...</option>';
                schemes.forEach((s, i) => {
                    const status = s.is_active === 0 ? ' [已停用]' : '';
                    sel.innerHTML += `<option value="${i}">${i+1}. ${s.name}${status}</option>`;
                });
            } catch (e) {
                sel.innerHTML = '<option value="">❌ 加载失败</option>';
                console.error('加载方案失败:', e);
            }
        }

        async function saveQbtScheme() {
            try {
                // 1. 先从API获取现有方案
                const schemes = await loadSchemesFromAPI();
                const schemeNames = schemes.map(s => s.name);
                
                // 2. 构建选择对话框
                let name = '';
                if (schemeNames.length > 0) {
                    const nameList = schemeNames.map((n, i) => `${i + 1}. ${n}`).join('\n');
                    const input = prompt(
                        `已有方案（输入序号或新名称）：\n${nameList}\n\n输入方案名称或序号：`,
                        ''
                    );
                    if (!input) return;
                    
                    const idx = parseInt(input) - 1;
                    if (!isNaN(idx) && idx >= 0 && idx < schemeNames.length) {
                        name = schemeNames[idx];
                        if (!confirm(`覆盖方案 "${name}"？`)) return;
                    } else {
                        name = input.trim();
                    }
                } else {
                    name = prompt('方案名称:', '');
                    if (!name) return;
                }
                
                // 3. 构建方案数据
                const timelineMode = document.getElementById('qbt-timeline-mode').value === 'true';
                const scheme = {
                    scheme_name: name,
                    scheme_desc: `回测方案: ${name}`,
                    conditions: getQbtConditions(),
                    stop_loss_pct: parseFloat(document.getElementById('qbt-sl').value),
                    take_profit_pct: parseFloat(document.getElementById('qbt-tp').value),
                    max_hold_time: parseInt(document.getElementById('qbt-window').value),
                    price_offset: parseFloat(document.getElementById('qbt-offset').value) || 0.0,
                    offset_mode: document.getElementById('qbt-offset-mode').value || 'fixed',
                    return_calc_method: document.getElementById('qbt-return-calc').value || 'compound',
                    timeline_mode: timelineMode ? 1 : 0,
                    initial_capital: timelineMode ? (parseFloat(document.getElementById('qbt-initial-capital').value) || 1000000) : 1000000,
                    time_start: document.getElementById('qbt-time-start').value || '09:30',
                    time_end: document.getElementById('qbt-time-end').value || '15:00',
                    date_start: document.getElementById('qbt-date-start').value,
                    date_end: document.getElementById('qbt-date-end').value,
                    dedup: document.getElementById('qbt-dedup').value,
                    is_active: 1,
                    use_backtest: 1,
                    use_realtime: 1,
                    use_replay: 1
                };
                
                // 4. 保存到MySQL（注意：monitor_bp的URL前缀是/api/monitor）
                const response = await fetch('/api/monitor/quant-schemes', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(scheme)
                });
                
                if (!response.ok) {
                    throw new Error(`保存失败: ${response.status}`);
                }
                
                const result = await response.json();
                if (!result.success) {
                    throw new Error(result.error || '保存失败');
                }
                
                // 5. 刷新列表
                await renderQbtSchemeSelect();
                alert(schemeNames.includes(name) ? '方案已覆盖' : '方案已保存');
                
            } catch (e) {
                alert('保存失败: ' + e.message);
                console.error(e);
            }
        }

        async function loadQbtScheme() {
            try {
                const idx = parseInt(document.getElementById('qbt-scheme-select').value);
                if (isNaN(idx)) return;
                
                const schemes = await loadSchemesFromAPI();
                const s = schemes[idx];
                if (!s) return;

                // 清空现有条件
                _conditions = [];
                _groups = [];
                
                // 回填回测区间
                document.getElementById('qbt-date-start').value = s.date_start || '';
                document.getElementById('qbt-date-end').value = s.date_end || '';

                document.getElementById('qbt-tp').value = s.tp_pct || 0.5;
                document.getElementById('qbt-sl').value = s.sl_pct || 0.3;
                document.getElementById('qbt-window').value = s.window_minutes || 5;
                document.getElementById('qbt-offset').value = s.price_offset || 0.0;
                document.getElementById('qbt-offset-mode').value = s.offset_mode || 'fixed';
                document.getElementById('qbt-return-calc').value = s.return_calc_method || 'compound';
                document.getElementById('qbt-timeline-mode').value = s.timeline_mode ? 'true' : 'false';
                document.getElementById('qbt-initial-capital').value = s.initial_capital || 1000000;
                onTimelineModeChange();  // 更新相关控件状态
                document.getElementById('qbt-time-start').value = s.time_start || '09:30';
                document.getElementById('qbt-time-end').value = s.time_end || '15:00';
                document.getElementById('qbt-dedup').value = s.dedup || 'first_per_minute';

                document.getElementById('qbt-conditions').innerHTML = '';
                
                // 安全地处理conditions：支持两种格式
                // 格式1: conditions = {conditions: [...], groups: [...]}
                // 格式2: conditions = [...] (旧版数组格式)
                let conds = s.conditions;
                let groups = s.groups || [];
                
                // 如果conditions是对象且包含conditions/groups属性，提取它们
                if (conds && typeof conds === 'object' && !Array.isArray(conds)) {
                    if (conds.conditions !== undefined) {
                        groups = conds.groups || groups;
                        conds = conds.conditions;
                    }
                }
                
                // 确保conds是数组
                if (!Array.isArray(conds)) {
                    conds = [];
                }
                if (!Array.isArray(groups)) {
                    groups = [];
                }
                
                // 回填基础条件（保留所有属性，包括is_field_compare和compare_field）
                conds.forEach(c => {
                    if (c && typeof c === 'object' && c.field && c.op) {
                        _conditions.push({
                            field: c.field,
                            op: c.op,
                            value: c.value !== undefined ? c.value : '',
                            is_field_compare: c.is_field_compare || false,
                            compare_field: c.compare_field || ''
                        });
                    }
                });
                
                // 回填条件组
                _groups = groups;
                
                // 重新渲染条件区
                renderConditions();
            } catch (e) {
                alert('加载方案失败: ' + e.message);
            }
        }

        function deleteQbtScheme() {
            const sel = document.getElementById('qbt-scheme-select');
            const idx = parseInt(sel.value);
            if (isNaN(idx)) { alert('请先选择要删除的方案'); return; }
            const schemes = _getSchemes();
            if (!confirm(`确定删除方案"${schemes[idx]?.name}"？`)) return;
            schemes.splice(idx, 1);
            _saveSchemes(schemes);
            renderQbtSchemeSelect();
        }

        // CSV导出
        function exportQbtCSV() {
            if (!_qbtTrades.length) { alert('无数据可导出'); return; }
            
            // 获取日期范围用于文件名
            const dateStart = document.getElementById('qbt-date-start')?.value || '';
            const dateEnd = document.getElementById('qbt-date-end')?.value || '';
            const dateStr = dateStart === dateEnd ? dateStart : `${dateStart}_${dateEnd}`;
            
            // CSV头部（添加日期列）
            const header = '日期,代码,名称,信号时间,入场价,出场价,出场时间,结果,盈亏%,持续秒,最高价,最低价\n';
            const rows = _qbtTrades.map(t =>
                `${t.date || ''},${t.bond_code},${t.bond_name || ''},${t.signal_time},${t.entry_price},${t.exit_price},${t.exit_time},${t.exit_type},${t.profit_pct},${t.duration_sec},${t.max_price || ''},${t.min_price || ''}`
            ).join('\n');
            const blob = new Blob(['\uFEFF' + header + rows], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `回测结果_${dateStr}.csv`;
            a.click();
            URL.revokeObjectURL(url);
        }
        
        // 页面加载时从API加载方案
        document.addEventListener('DOMContentLoaded', function() {
            renderQbtSchemeSelect();
        });
    </script>
</body>
</html>
