<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>GS2026 - 数据分析</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}?v=5">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}?v=5">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pages.css') }}?v=5">
</head>
<body>
    <div class="app">
        <!-- 头部导航 -->
        <!-- 头部导航 -->
    {% set page_title = '数据分析' %}
    {% set active_page = 'analysis' %}
    {% include 'nav.html' %}

        <main class="app-main">
            <!-- Tab 导航 -->
            <div id="tab-nav"></div>

            <!-- 服务网格 -->
            <section class="service-section">
                <div id="service-grid" class="service-grid"></div>
            </section>

            <!-- 运行中的分析任务 -->
            <section class="process-section">
                <h3 class="section-title">⚙️ 当前运行进程服务</h3>
                <div id="process-list"></div>
            </section>
        </main>
    </div>

    <!-- 核心框架 -->
    <script src="{{ url_for('static', filename='js/core/logger.js') }}"></script>
    <script src="{{ url_for('static', filename='js/core/event-bus.js') }}"></script>
    <script src="{{ url_for('static', filename='js/core/api-client.js') }}"></script>
    <script src="{{ url_for('static', filename='js/core/state-store.js') }}"></script>
    <script src="{{ url_for('static', filename='js/core/utils.js') }}"></script>
    <script src="{{ url_for('static', filename='js/core/notification.js') }}"></script>
    <script src="{{ url_for('static', filename='js/core/app.js') }}"></script>

    <!-- 管理器 -->
    <script src="{{ url_for('static', filename='js/modules/base-manager.js') }}?v=5"></script>
    <script src="{{ url_for('static', filename='js/modules/analysis-manager.js') }}?v=10"></script>

    <!-- 组件 -->
    <script src="{{ url_for('static', filename='js/components/base-component.js') }}?v=5"></script>
    <script src="{{ url_for('static', filename='js/components/tab-nav.js') }}?v=5"></script>
    <script src="{{ url_for('static', filename='js/components/service-card.js') }}?v=8"></script>
    <script src="{{ url_for('static', filename='js/components/process-list.js') }}?v=15"></script>

    <!-- 页面 -->
    <script src="{{ url_for('static', filename='js/pages/analysis-page.js') }}?v=8"></script>
</body>
</html>
