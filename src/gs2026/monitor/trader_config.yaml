# 交易助手适配器配置（monitor_bond 侧）
# 修改此文件后重启 monitor_bond 即可生效，无需改代码

# 是否启用交易助手
enabled: true

# 是否检查交易时段（false=任何时间都触发，用于测试）
check_trading_time: false

# 交易助手HTTP服务地址
trader_api_url: "http://127.0.0.1:8081"

# 允许触发的方案列表（为空=全部允许）
# 例如: ['大盘债券斜率共振', '强势反弹']
allowed_schemes: []

# 禁止触发的方案列表
blocked_schemes: []

# 同一债券最短去抖间隔（秒），仅防止同一tick重复
min_interval_seconds: 10

# 单日最大触发次数
max_daily_triggers: 50

# 默认买入手数（1手=10张）
default_lots: 1

# HTTP请求超时（秒）
request_timeout: 5

# 价格有效范围（超出则风控拦截）
price_range:
  min: 50
  max: 200

# 通知方式
notifications:
  sound: true
  console: true
  windows_toast: false
