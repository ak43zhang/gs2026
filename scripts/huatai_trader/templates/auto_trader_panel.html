<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>量化自动交易面板</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { 
    font-family: -apple-system, 'Microsoft YaHei', sans-serif; 
    background: #1a1a2e; 
    color: #eee; 
    min-height: 100vh; 
    padding: 20px; 
}
.container { max-width: 900px; margin: 0 auto; }
h1 { text-align: center; color: #00d4ff; margin-bottom: 10px; font-size: 24px; }
.subtitle { text-align: center; color: #888; font-size: 12px; margin-bottom: 20px; }

.header { 
    display: flex; 
    justify-content: space-between; 
    align-items: center; 
    margin-bottom: 20px;
    padding: 10px 15px;
    background: #16213e;
    border-radius: 8px;
}

.status-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
}

.status-dot { 
    width: 10px; 
    height: 10px; 
    border-radius: 50%; 
    display: inline-block; 
}

.dot-idle { background: #00ff88; box-shadow: 0 0 8px #00ff88; }
.dot-trading { background: #ffcc00; box-shadow: 0 0 8px #ffcc00; animation: pulse 1s infinite; }
.dot-monitoring { background: #00ccff; box-shadow: 0 0 8px #00ccff; animation: pulse 1s infinite; }

@keyframes pulse { 50% { opacity: 0.6; } }

.refresh-indicator { font-size: 12px; color: #666; }

.card { 
    background: #16213e; 
    border-radius: 12px; 
    padding: 20px; 
    margin-bottom: 16px; 
    border: 1px solid #0f3460; 
}

.card-title { 
    font-size: 14px; 
    color: #888; 
    margin-bottom: 12px; 
    text-transform: uppercase; 
    letter-spacing: 1px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

/* 状态显示 */
.state-display {
    text-align: center;
    padding: 30px;
}

.state-icon {
    font-size: 48px;
    margin-bottom: 10px;
}

.state-text {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 5px;
}

.state-desc {
    font-size: 13px;
    color: #888;
}

/* 命中列表 */
.hit-list { margin-top: 10px; }
.hit-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 15px;
    background: #0f3460;
    border-radius: 8px;
    margin-bottom: 8px;
    border-left: 3px solid #00d4ff;
}

.hit-item.expired {
    opacity: 0.5;
    border-left-color: #666;
}

.hit-info { flex: 1; }
.hit-code { font-size: 18px; font-weight: bold; color: #00d4ff; }
.hit-name { font-size: 13px; color: #aaa; margin-left: 8px; }
.hit-details {
    display: flex;
    gap: 15px;
    margin-top: 5px;
    font-size: 12px;
    color: #888;
}

.hit-tp { color: #00ff88; }
.hit-sl { color: #ff4444; }

.hit-age {
    font-size: 11px;
    color: #666;
    margin-right: 10px;
}

.btn-buy {
    padding: 8px 20px;
    background: #00cc66;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.2s;
}

.btn-buy:hover { background: #00ff88; transform: scale(1.05); }
.btn-buy:active { transform: scale(0.95); }

/* 交易中状态 */
.trading-info {
    text-align: center;
    padding: 20px;
}

.trading-code {
    font-size: 32px;
    font-weight: bold;
    color: #00d4ff;
    margin-bottom: 5px;
}

.trading-name {
    font-size: 16px;
    color: #aaa;
    margin-bottom: 20px;
}

.trading-steps {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin: 20px 0;
}

.step {
    display: flex;
    flex-direction: column;
    align-items: center;
    opacity: 0.4;
}

.step.active { opacity: 1; }
.step.done { opacity: 1; }

.step-icon {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #0f3460;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    margin-bottom: 5px;
}

.step.done .step-icon { background: #00cc66; }
.step.active .step-icon { 
    background: #ffcc00; 
    animation: pulse 1s infinite;
}

.step-text { font-size: 12px; color: #888; }

.countdown {
    font-size: 48px;
    font-weight: bold;
    color: #ffcc00;
    text-align: center;
    margin: 20px 0;
}

.countdown.urgent {
    color: #ff4444;
    animation: blink 0.5s infinite;
}

@keyframes blink { 50% { opacity: 0.5; } }

.trading-hint {
    background: #0f3460;
    padding: 15px;
    border-radius: 8px;
    margin: 15px 0;
    font-size: 13px;
    color: #ccc;
}

/* 持仓监控 */
.monitoring-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.monitoring-code {
    font-size: 24px;
    font-weight: bold;
    color: #00d4ff;
}

.monitoring-name {
    font-size: 14px;
    color: #aaa;
}

.profit-display {
    text-align: right;
}

.profit-value {
    font-size: 28px;
    font-weight: bold;
}

.profit-positive { color: #00ff88; }
.profit-negative { color: #ff4444; }
.profit-neutral { color: #888; }

.profit-label {
    font-size: 12px;
    color: #666;
}

.price-info {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin: 20px 0;
}

.price-box {
    background: #0f3460;
    padding: 15px;
    border-radius: 8px;
    text-align: center;
}

.price-label {
    font-size: 11px;
    color: #666;
    margin-bottom: 5px;
}

.price-value {
    font-size: 18px;
    font-weight: bold;
}

.price-tp { color: #00ff88; }
.price-sl { color: #ff4444; }

.progress-bar {
    height: 8px;
    background: #0f3460;
    border-radius: 4px;
    overflow: hidden;
    margin: 10px 0;
}

.progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #ff4444, #ffcc00, #00ff88);
    border-radius: 4px;
    transition: width 0.5s;
}

.hold-time {
    text-align: center;
    font-size: 14px;
    color: #888;
    margin-top: 10px;
}

/* 历史记录 */
.history-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 15px;
    border-bottom: 1px solid #0f3460;
    font-size: 13px;
}

.history-item:last-child { border-bottom: none; }

.history-code { font-weight: bold; color: #00d4ff; }
.history-result {
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 11px;
}

.result-take_profit { background: #0f4a2d; color: #00ff88; }
.result-stop_loss { background: #4a0f0f; color: #ff4444; }
.result-force_sell { background: #4a3a0f; color: #ffcc00; }
.result-timeout_cancelled { background: #333; color: #888; }

.empty {
    text-align: center;
    color: #555;
    padding: 30px;
    font-size: 14px;
}

/* 响应式 */
@media (max-width: 600px) {
    .price-info { grid-template-columns: 1fr; }
    .trading-steps { flex-direction: column; gap: 10px; }
}
</style>
</head>
<body>
<div class="container">
    <h1>⚡ 量化自动交易</h1>
    <div class="subtitle">自动止盈止损 | 持仓监控 | 一键交易</div>
    
    <div class="header">
        <div class="status-badge">
            <span class="status-dot" id="status-dot"></span>
            <span id="status-text">加载中...</span>
        </div>
        <span class="refresh-indicator" id="refresh-info">连接中...</span>
    </div>

    <!-- 主内容区 -->
    <div id="main-content">
        <div class="card">
            <div class="empty">加载中...</div>
        </div>
    </div>

    <!-- 历史记录 -->
    <div class="card">
        <div class="card-title">
            <span>📜 今日记录</span>
            <span id="history-count" style="font-size: 12px; color: #666;">0笔</span>
        </div>
        <div id="history-content"><div class="empty">暂无记录</div></div>
    </div>
</div>

<script>
const API_BASE = '/api/auto_trade';

async function api(endpoint, method='GET') {
    try {
        const opts = method === 'POST' ? {
            method: 'POST', 
            headers: {'Content-Type': 'application/json'}
        } : {};
        const resp = await fetch(API_BASE + endpoint, opts);
        return await resp.json();
    } catch(e) {
        console.error('API错误:', e);
        return null;
    }
}

function formatTime(seconds) {
    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60);
    return `${m}分${s}秒`;
}

function getStateInfo(state) {
    const map = {
        'IDLE': { icon: '○', text: '等待选择', desc: '量化信号实时推送中', dotClass: 'dot-idle' },
        'TRADING': { icon: '🔒', text: '交易执行中', desc: '请在华泰软件中点击买入', dotClass: 'dot-trading' },
        'MONITORING': { icon: '📊', text: '持仓监控中', desc: '自动止盈止损保护中', dotClass: 'dot-monitoring' },
        'DISABLED': { icon: '⚠', text: '功能未启用', desc: '请检查配置', dotClass: '' },
    };
    return map[state] || { icon: '?', text: state, desc: '', dotClass: '' };
}

function getResultClass(reason) {
    const map = {
        'take_profit': 'result-take_profit',
        'stop_loss': 'result-stop_loss',
        'force_sell': 'result-force_sell',
        'timeout_cancelled': 'result-timeout_cancelled',
    };
    return map[reason] || '';
}

function getResultText(reason) {
    const map = {
        'take_profit': '止盈',
        'stop_loss': '止损',
        'force_sell': '强平',
        'timeout_cancelled': '超时撤单',
    };
    return map[reason] || reason;
}

// ==================== 渲染函数 ====================

function renderIdle(data) {
    const hitList = data.hit_list || [];
    
    if (hitList.length === 0) {
        return `
            <div class="card">
                <div class="state-display">
                    <div class="state-icon">📡</div>
                    <div class="state-text">等待量化信号</div>
                    <div class="state-desc">命中信号将实时显示在这里</div>
                </div>
            </div>
        `;
    }
    
    const hitsHtml = hitList.map(hit => {
        const age = Math.floor((Date.now()/1000 - hit.hit_time));
        const expired = age >= 30;
        return `
            <div class="hit-item ${expired ? 'expired' : ''}">
                <div class="hit-info">
                    <div>
                        <span class="hit-code">${hit.code}</span>
                        <span class="hit-name">${hit.name || ''}</span>
                    </div>
                    <div class="hit-details">
                        <span>买入价: <b>${hit.buy_price}</b></span>
                        <span class="hit-tp">止盈: ${hit.tp_pct}%</span>
                        <span class="hit-sl">止损: ${hit.sl_pct}%</span>
                        <span>数量: ${hit.quantity}张</span>
                    </div>
                </div>
                <div style="display: flex; align-items: center;">
                    <span class="hit-age">${age}秒前</span>
                    ${!expired ? `<button class="btn-buy" onclick="doBuy('${hit.code}')">买入</button>` : ''}
                </div>
            </div>
        `;
    }).join('');
    
    return `
        <div class="card">
            <div class="card-title">
                <span>🎯 实时命中 (${hitList.length})</span>
                <span style="font-size: 11px; color: #666;">30秒后过期</span>
            </div>
            <div class="hit-list">${hitsHtml}</div>
        </div>
    `;
}

function renderTrading(data) {
    const current = data.current;
    const countdown = data.countdown || 0;
    const urgent = countdown <= 10 ? 'urgent' : '';
    
    return `
        <div class="card">
            <div class="trading-info">
                <div class="trading-code">${current.code}</div>
                <div class="trading-name">${current.name || ''}</div>
                
                <div class="trading-steps">
                    <div class="step done">
                        <div class="step-icon">✓</div>
                        <div class="step-text">填充表单</div>
                    </div>
                    <div class="step active">
                        <div class="step-icon">⏱</div>
                        <div class="step-text">等待成交</div>
                    </div>
                    <div class="step">
                        <div class="step-icon">◎</div>
                        <div class="step-text">设置TP/SL</div>
                    </div>
                </div>
                
                <div class="countdown ${urgent}">${countdown}s</div>
                <div style="color: #888; font-size: 13px;">后自动撤单</div>
                
                <div class="trading-hint">
                    💡 请在<b>华泰xiadan</b>中点击<b>[买入]</b>按钮<br>
                    系统会自动检测成交弹窗并设置止盈止损
                </div>
            </div>
        </div>
    `;
}

function renderMonitoring(data) {
    const current = data.current;
    const m = data.monitoring;
    
    if (!m) return '<div class="card"><div class="empty">监控数据加载中...</div></div>';
    
    const profit = m.current_price ? ((m.current_price - current.buy_price) / current.buy_price * 100).toFixed(2) : '0.00';
    const profitClass = profit > 0 ? 'profit-positive' : profit < 0 ? 'profit-negative' : 'profit-neutral';
    const profitSign = profit > 0 ? '+' : '';
    
    const holdPercent = Math.min(100, (m.hold_seconds / m.max_hold_seconds) * 100);
    
    return `
        <div class="card">
            <div class="monitoring-header">
                <div>
                    <div class="monitoring-code">${current.code}</div>
                    <div class="monitoring-name">${current.name || ''}</div>
                </div>
                <div class="profit-display">
                    <div class="profit-value ${profitClass}">${profitSign}${profit}%</div>
                    <div class="profit-label">当前盈亏</div>
                </div>
            </div>
            
            <div class="price-info">
                <div class="price-box">
                    <div class="price-label">买入价</div>
                    <div class="price-value">${current.buy_price}</div>
                </div>
                <div class="price-box">
                    <div class="price-label price-tp">止盈 ≥ ${m.tp_level}</div>
                    <div class="price-value price-tp">+${current.tp_pct}%</div>
                </div>
                <div class="price-box">
                    <div class="price-label price-sl">止损 ≤ ${m.sl_level}</div>
                    <div class="price-value price-sl">-${current.sl_pct}%</div>
                </div>
            </div>
            
            <div style="margin: 15px 0;">
                <div style="display: flex; justify-content: space-between; font-size: 12px; color: #666; margin-bottom: 5px;">
                    <span>持仓进度</span>
                    <span>${formatTime(m.hold_seconds)} / ${formatTime(m.max_hold_seconds)}</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: ${holdPercent}%"></div>
                </div>
            </div>
            
            <div class="hold-time">
                ${m.hold_seconds >= m.max_hold_seconds - 60 ? '⚠️ 即将超时强平' : '⏱️ 持仓监控中...'}
            </div>
        </div>
    `;
}

function renderHistory(history) {
    const el = document.getElementById('history-content');
    const countEl = document.getElementById('history-count');
    
    if (!history || history.length === 0) {
        el.innerHTML = '<div class="empty">暂无记录</div>';
        countEl.textContent = '0笔';
        return;
    }
    
    countEl.textContent = `${history.length}笔`;
    
    const items = history.slice().reverse().slice(0, 10);
    el.innerHTML = items.map(h => {
        const time = (h.time || '').split('T')[1]?.substring(0,5) || '';
        return `
            <div class="history-item">
                <div>
                    <span class="history-code">${h.code}</span>
                    <span style="color: #666; margin-left: 5px;">${h.name || ''}</span>
                </div>
                <div>
                    <span style="color: #888; margin-right: 10px; font-size: 11px;">${time}</span>
                    <span class="history-result ${getResultClass(h.reason)}">${getResultText(h.reason)}</span>
                </div>
            </div>
        `;
    }).join('');
}

// ==================== 操作函数 ====================

async function doBuy(code) {
    const btn = event.target;
    btn.disabled = true;
    btn.textContent = '...';
    
    const result = await api(`/buy/${code}`, 'POST');
    if (result && result.success) {
        console.log('买入开始:', result.message);
    } else {
        alert(result?.message || '买入失败');
        btn.disabled = false;
        btn.textContent = '买入';
    }
    refresh();
}

// ==================== 主刷新 ====================

async function refresh() {
    const data = await api('/status');
    const contentEl = document.getElementById('main-content');
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const refreshInfo = document.getElementById('refresh-info');
    
    if (!data) {
        refreshInfo.textContent = '○ 断开';
        return;
    }
    
    const stateInfo = getStateInfo(data.state);
    statusDot.className = 'status-dot ' + stateInfo.dotClass;
    statusText.textContent = stateInfo.text;
    refreshInfo.textContent = '● 实时';
    
    // 根据状态渲染不同内容
    if (data.state === 'IDLE') {
        contentEl.innerHTML = renderIdle(data);
    } else if (data.state === 'TRADING') {
        contentEl.innerHTML = renderTrading(data);
    } else if (data.state === 'MONITORING') {
        contentEl.innerHTML = renderMonitoring(data);
    } else {
        contentEl.innerHTML = `
            <div class="card">
                <div class="state-display">
                    <div class="state-icon">${stateInfo.icon}</div>
                    <div class="state-text">${stateInfo.text}</div>
                    <div class="state-desc">${stateInfo.desc}</div>
                </div>
            </div>
        `;
    }
    
    renderHistory(data.history);
}

// 每秒刷新
setInterval(refresh, 1000);
refresh();
</script>
</body>
</html>
