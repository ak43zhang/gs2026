# 华泰证券可转债半自动交易助手配置
# 注意：本系统只填充证券代码，不自动提交，需人工最终点击"买入"确认

# ==================== 交易行为配置 ====================
trading_behavior:
  # 价格填充模式：
  #   "auto"   - 不填价格，由软件默认（通常是卖1价）【默认】
  #   "manual" - 使用API传入的价格填充
  price_mode: "auto"
  
  # 数量填充模式：
  #   "auto"    - 不填数量，由软件默认
  #   "fixed"   - 使用固定数量（default_quantity）
  #   "manual"  - 使用API传入的数量
  quantity_mode: "auto"
  
  # 固定数量（张数），仅在 quantity_mode="fixed" 时生效
  # 10张=1手, 20张=2手
  default_quantity: 10
  
  # 提示音（成功时短促"叮"，失败时长"嘟"）
  sound_enabled: true
  
  # 自定义提示音（WAV文件路径，为空则使用系统默认音）
  # 例如: "D:\\sounds\\ding.wav"
  sound_file_success: ""
  sound_file_fail: ""

# ==================== 交易时段配置 ====================
trading_hours:
  # 是否启用交易时段检查（false=任何时间都可操作，用于测试）
  check_enabled: false
  
  morning_session:
    start_time: "09:30"
    end_time: "11:30"
  
  afternoon_session:
    start_time: "13:00"
    end_time: "15:00"

# ==================== 风险控制配置 ====================
risk_control:
  # 单日最大触发次数
  max_daily_triggers: 50
  
  # 同一债券最短间隔（秒），仅防止同一tick重复
  min_interval_same_bond_seconds: 10
  
  # 可转债价格有效范围
  bond_price_range:
    min_price: 50.0
    max_price: 200.0

# ==================== 软件窗口配置 ====================
window_config:
  # 华泰证券软件exe路径（用于连接进程）
  exe_path: "D:\\华泰证券网上交易委托系统\\xiadan.exe"
  
  # 主窗口标题
  main_window_title: "网上股票交易系统5.0"
  
  # pywinauto后端（win32兼容32位软件）
  backend: "win32"

# ==================== HTTP服务配置 ====================
http_server:
  port: 8081
  host: "127.0.0.1"

# ==================== 日志配置 ====================
logging:
  level: "INFO"
  log_file: "交易助手.log"
  retention_days: 30
  console_output: true
