# Huatai Trader - Unified Configuration
# 华泰证券可转债半自动交易助手 统一配置
# Location: configs/huatai_trader/config.yaml

# ==================== Behavior - 交易行为 ====================
behavior:
  # Price mode: "auto" = software default (卖1), "manual" = use API value
  price_mode: "auto"
  # Quantity mode: "auto" = software default, "fixed" = use default_quantity, "manual" = use API value
  quantity_mode: "auto"
  # Fixed quantity in shares (10 = 1 lot), only used when quantity_mode = "fixed"
  default_quantity: 10
  # Sound notification
  sound_enabled: true
  # Custom sound file (relative to project root, empty = system default)
  sound_success: "scripts/huatai_trader/notify.mp3"
  sound_fail: ""

# ==================== Hours - 交易时段 ====================
hours:
  # Set false to allow operations at any time (for testing)
  check_enabled: false
  morning: { start: "09:30", end: "11:30" }
  afternoon: { start: "13:00", end: "15:00" }

# ==================== Filter - 触发过滤（适配器侧）====================
filter:
  # Master switch
  enabled: true
  # Set false to trigger outside trading hours (for testing)
  check_trading_time: false
  # Allowed schemes (empty = all active MySQL schemes allowed)
  allowed_schemes: []
  # Blocked schemes
  blocked_schemes: []
  # Same-bond debounce interval (seconds)
  min_interval_seconds: 10
  # Max triggers per day
  max_daily_triggers: 50
  # HTTP request timeout (seconds)
  request_timeout: 5
  # Valid price range for convertible bonds
  price_range: { min: 50, max: 200 }

# ==================== Window - 华泰软件窗口 ====================
window:
  exe_path: "D:\\华泰证券网上交易委托系统\\xiadan.exe"
  title: "网上股票交易系统5.0"
  backend: "win32"

# ==================== Server - HTTP服务 ====================
server:
  host: "127.0.0.1"
  port: 8081

# ==================== Logging - 日志 ====================
logging:
  level: "INFO"
  file: "huatai_trader.log"
  console: true

# ==================== Auto Trader - 自动止盈止损 ====================
auto_trader:
  # 总开关
  enabled: true
  
  # 命中信号过期时间(秒) - 超过此时间未买入则自动过期
  signal_expire_seconds: 30
  
  # 等待成交弹窗超时(秒) - 超过此时间未检测到成交则撤单
  fill_timeout_seconds: 30
  
  # 弹窗检测频率(毫秒)
  popup_poll_ms: 100
  
  # 声音提示配置
  sounds:
    enabled: true
    # 各事件对应的声音文件路径(相对项目根目录)
    hit: "scripts/huatai_trader/sounds/hit.wav"
    filled: "scripts/huatai_trader/sounds/filled.wav"
    tp_sl_set: "scripts/huatai_trader/sounds/done.wav"
    tp_triggered: "scripts/huatai_trader/sounds/tp.wav"
    sl_triggered: "scripts/huatai_trader/sounds/sl.wav"
    force_sell: "scripts/huatai_trader/sounds/force_sell.wav"
    timeout: "scripts/huatai_trader/sounds/timeout.wav"
    alert: "scripts/huatai_trader/sounds/alert.wav"
    trade_end: "scripts/huatai_trader/sounds/end.wav"
